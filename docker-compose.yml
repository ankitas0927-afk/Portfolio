version: '3.9'

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ['CMD-SHELL', 'mongosh --quiet --eval "db.adminCommand({ ping: 1 }).ok"']
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/ankita_portfolio
      FRONTEND_URL: http://localhost:3000
      API_PUBLIC_URL: http://localhost:5000
      JWT_ACCESS_SECRET: replace_with_a_long_random_secret_at_least_32_chars
      JWT_REFRESH_SECRET: replace_with_a_different_long_random_secret_at_least_32_chars
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      COOKIE_SECURE: 'false'
      COOKIE_SAME_SITE: lax
      ADMIN_NAME: Portfolio Administrator
      ADMIN_EMAIL: replace_with_admin_email
      ADMIN_INITIAL_PASSWORD: replace_with_strong_password
      RESUME_PDF_PATH: ../../../Ankita CV edit.pdf
      PROFILE_IMAGE_PATH: ''
      OWNER_PUBLIC_EMAIL: ''
      OWNER_PRIVATE_EMAIL: ''
      OWNER_PUBLIC_PHONE: ''
      OWNER_PRIVATE_PHONE: ''
      OWNER_CITY: Lucknow
      OWNER_STATE: Uttar Pradesh
      OWNER_COUNTRY: India
      OWNER_PRIVATE_ADDRESS: ''
      OWNER_DATE_OF_BIRTH: ''
      OWNER_PARENT_GUARDIAN: ''
      OWNER_GENDER: ''
      OWNER_NATIONALITY: Indian
      MAX_PROFILE_IMAGE_MB: 5
      MAX_CONTENT_IMAGE_MB: 8
      MAX_RESUME_MB: 10
      MAX_CERTIFICATE_MB: 10
      MAX_DOCUMENT_MB: 15
    ports:
      - '5000:5000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:5000/health | grep -q ok']
      interval: 15s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:5000/api/v1
      INTERNAL_API_BASE_URL: http://api:5000/api/v1
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    ports:
      - '3000:3000'

volumes:
  mongodb_data:
